name: Java CI with Maven

on:
  push:
    branches:
      - twitter
  pull_request:
    branches:
      - twitter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run tests with Maven
        run: mvn clean test
